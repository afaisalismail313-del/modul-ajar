<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard - Aplikasi MA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
:root{--g1:#1a5c2e;--g2:#2e7d32;--e1:#b8860b;--e2:#daa520;--gp:#e8f5e9;--ep:#fff8e1}
body{background:linear-gradient(135deg,var(--gp),var(--ep));min-height:100vh}
.hdr{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;
     padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:18px}
.hdr .who{font-size:12px;opacity:.9}
.hdr button{background:var(--e2);color:var(--g1);border:none;padding:8px 16px;
            border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
.greeting{margin-bottom:24px}
.greeting h2{color:var(--g1);font-size:22px}
.greeting p{color:#555;margin-top:4px;font-size:14px}

/* ============ GRID KARTU BUNDAR ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}

/* Kartu menu BENTUK LINGKARAN penuh */
.menu{
  position:relative;
  display:block;
  width:100%;
  aspect-ratio:1/1;             /* tetap persegi => lingkaran sempurna */
  background:#fff;
  border-radius:50%;            /* LINGKARAN */
  border:3px solid var(--e2);   /* ring emas mengelilingi */
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  text-decoration:none;color:inherit;
  overflow:hidden;
  transition:transform .15s,box-shadow .15s;
}
.menu:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,.15)}

/* Isi kartu diposisikan ABSOLUT di dalam lingkaran agar lingkaran tidak melar */
.menu-in{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:16%;
}
.menu .ico{
  width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,var(--g2),var(--e2));
  color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,.15);
}
.menu h3{color:var(--g1);font-size:14px;margin-bottom:4px;line-height:1.25}
.menu p{
  font-size:11px;color:#666;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.badge{display:inline-block;background:var(--g2);color:#fff;font-size:10px;
       padding:2px 8px;border-radius:10px;margin-top:8px}
.badge.soon{background:#888}

/* Fallback browser lama yang belum mendukung aspect-ratio */
@supports not (aspect-ratio:1/1){
  .menu{height:auto}
  .menu::before{content:"";display:block;padding-top:100%}
}

/* ============ RESPONSIVE TAMPILAN HP ============ */
@media(max-width:640px){
  .wrap{padding:16px}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}  /* 2 lingkaran per baris */
  .menu{border-width:2px}
  .menu-in{padding:12%}
  .menu .ico{width:46px;height:46px;font-size:20px;margin-bottom:6px}
  .menu h3{font-size:12px}
  .menu p{display:none}   /* deskripsi disembunyikan agar lingkaran rapi di HP */
  .badge{margin-top:5px}
}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <h1>📚 Dashboard Aplikasi MA</h1>
    <div class="who" id="whoAmI"></div>
  </div>
  <button onclick="Auth.logout()">Keluar</button>
</div>

<div class="wrap">
  <div class="greeting">
    <h2 id="greet">Selamat Datang</h2>
    <p>Pilih menu di bawah untuk melanjutkan.</p>
  </div>

  <div class="grid">
    <!-- Menu: Modul Ajar -->
    <a href="modul-ajar.html" class="menu">
      <div class="menu-in">
        <div class="ico">📝</div>
        <h3>Modul Ajar</h3>
        <p>Generate Modul Ajar Terintegrasi KBC berbasis ATP.</p>
        <span class="badge">Aktif</span>
      </div>
    </a>

    <!-- Menu: Worksheet -->
    <a href="worksheet.html" class="menu">
      <div class="menu-in">
        <div class="ico">🧩</div>
        <h3>Worksheet</h3>
        <p>Buat Students Worksheet F4 otomatis dengan prompt AI siap pakai.</p>
        <span class="badge">Aktif</span>
      </div>
    </a>
  </div>
</div>

<script>
Auth.requireLogin();

const user = Auth.getUser();
document.getElementById('whoAmI').textContent =
  `${user.role.toUpperCase()} • ${user.nama || user.username}`;
document.getElementById('greet').textContent =
  `Selamat Datang, ${user.nama || user.username} 👋`;
</script>
</body>
</html>
