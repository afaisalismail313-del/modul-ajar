<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login - Aplikasi MA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
:root{--g1:#1a5c2e;--g2:#2e7d32;--e1:#b8860b;--e2:#daa520;--gp:#e8f5e9;--ep:#fff8e1}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
     background:linear-gradient(135deg,var(--g1),var(--g2),var(--e1))}
.box{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:430px;
     box-shadow:0 20px 60px rgba(0,0,0,.3);border:3px solid var(--e2)}
.icon{width:80px;height:80px;background:linear-gradient(135deg,var(--g2),var(--e2));
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      margin:0 auto 15px;font-size:36px}
h1{text-align:center;color:var(--g1);font-size:20px;margin-bottom:5px}
.sub{text-align:center;color:var(--e1);font-size:13px;margin-bottom:25px}
.fg{margin-bottom:14px}
.fg label{display:block;margin-bottom:6px;color:var(--g1);font-weight:600;font-size:13px}
.fg input{width:100%;padding:10px 14px;border:2px solid #ddd;border-radius:10px;font-size:14px}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;
     cursor:pointer;background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff}
.err{color:#d32f2f;font-size:13px;text-align:center;margin-top:10px;display:none}
.hint{text-align:center;margin-top:15px;font-size:12px;color:#888;line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🔐</div>
  <h1>LOGIN SISTEM MA</h1>
  <p class="sub">Aplikasi Terintegrasi MAN Bantaeng</p>

  <div class="fg"><label>👤 Username</label><input id="inpUser" autofocus></div>
  <div class="fg"><label>🔒 Password</label><input id="inpPass" type="password"></div>
  <button class="btn" onclick="doLogin()">MASUK APLIKASI</button>

  <p class="err" id="loginErr">Username atau password salah!</p>
  <div class="hint">
    <b>ADMIN:</b> admin / admin2025<br>
    <b>GURU:</b> guru / madrasah2025
  </div>
</div>

<script>
// Kalau sudah login, langsung lempar ke dashboard
if (Auth.getUser()) window.location.href = 'index.html';

function doLogin() {
  const u = document.getElementById('inpUser').value.trim();
  const p = document.getElementById('inpPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';

  const user = Auth.tryLogin(u, p);
  if (!user) { errEl.style.display = 'block'; return; }

  Auth.setUser(user);

  // Kembali ke halaman yang tadi diminta (kalau ada ?next=...)
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next') || 'index.html';
  window.location.href = next;
}

document.getElementById('inpPass').addEventListener('keypress', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
