<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Balap Pesawat Kuis ATP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .screen.active {
            display: block;
        }

        /* Menu Screen */
        .menu-screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-title {
            font-size: 2em;
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .menu-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Plane Selection */
        .plane-selection {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .plane-option {
            border: 3px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .plane-option.selected {
            border-color: #667eea;
            background: #f0f0ff;
            transform: scale(1.05);
        }

        .plane-option img {
            width: 100%;
            height: auto;
            max-width: 80px;
        }

        .plane-option.plane-1 { border-color: #4A90E2; }
        .plane-option.plane-2 { border-color: #E24A4A; }
        .plane-option.plane-3 { border-color: #E2A74A; }
        .plane-option.plane-4 { border-color: #4AE24A; }
        .plane-option.plane-5 { border-color: #8E4AE2; }
        .plane-option.plane-6 { border-color: #4AE2E2; }
        .plane-option.plane-7 { border-color: #E24A8E; }
        .plane-option.plane-8 { border-color: #D4AF37; }

        /* Background Selection */
        .bg-selection {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .bg-option {
            border: 3px solid #ddd;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .bg-option.selected {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .bg-option i {
            font-size: 24px;
            display: block;
            margin-bottom: 5px;
        }

        /* Game Screen */
        .game-screen {
            position: relative;
            padding: 0;
        }

        .game-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s;
        }

        .game-background.forest {
            background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 50%, #228B22 100%);
        }

        .game-background.ocean {
            background: linear-gradient(to bottom, #87CEEB 0%, #4169E1 50%, #1E90FF 100%);
        }

        .game-background.desert {
            background: linear-gradient(to bottom, #FFD700 0%, #FFA500 50%, #DAA520 100%);
        }

        .game-background.space {
            background: linear-gradient(to bottom, #000000 0%, #1a1a2e 50%, #16213e 100%);
        }

        .game-background.mountain {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0E0E0 50%, #696969 100%);
        }

        .game-background.sunset {
            background: linear-gradient(to bottom, #FF6B6B 0%, #FFE66D 50%, #4ECDC4 100%);
        }

        .race-track {
            position: relative;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .racer-lane {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            position: relative;
            min-height: 80px;
        }

        .racer-lane.player {
            border: 3px solid #FFD700;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        .lane-number {
            font-weight: bold;
            color: #333;
            margin-right: 10px;
            min-width: 30px;
        }

        .lane-plane {
            width: 60px;
            height: 60px;
            margin-right: 10px;
            transition: all 0.3s;
        }

        .lane-progress {
            flex: 1;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .lane-progress-bar {
            height: 100%;
            transition: width 0.5s ease-out;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
        }

        .finish-line {
            position: absolute;
            right: 10px;
            top: 0;
            bottom: 0;
            width: 20px;
            background: repeating-linear-gradient(
                45deg,
                #000,
                #000 10px,
                #fff 10px,
                #fff 20px
            );
        }

        /* Quiz Modal */
        .quiz-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-modal.active {
            display: flex;
        }

        .quiz-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .question-number {
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
        }

        .timer {
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .answer-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-btn {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            text-align: left;
        }

        .answer-btn:hover, .answer-btn:active {
            background: #f0f0ff;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .answer-btn.correct {
            background: #90EE90;
            border-color: #228B22;
        }

        .answer-btn.wrong {
            background: #ff6b6b;
            border-color: #cc0000;
        }

        /* Results Screen */
        .results-screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .results-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .trophy {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .winner-text {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .score-details {
            margin: 20px 0;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 10px;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-title {
                font-size: 1.5em;
            }

            .menu-card, .quiz-content, .results-card {
                padding: 20px;
            }

            .plane-selection {
                grid-template-columns: repeat(4, 1fr);
                gap: 5px;
            }

            .plane-option img {
                max-width: 60px;
            }

            .bg-selection {
                grid-template-columns: repeat(3, 1fr);
            }

            .lane-plane {
                width: 40px;
                height: 40px;
            }

            .question-text {
                font-size: 1.1em;
            }

            .answer-btn {
                padding: 12px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .plane-selection {
                grid-template-columns: repeat(4, 1fr);
            }

            .plane-option {
                padding: 5px;
            }

            .plane-option img {
                max-width: 50px;
            }

            .bg-selection {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>

            <div class="form-group">

    <!-- Game Screen -->
    <div class="screen game-screen" id="gameScreen">
        <div class="game-background" id="gameBackground"></div>

                    "Project Based Learning",
                    "Problem Based Learning",
                    "Discovery Learning",
                    "Inquiry Learning"
                ],
                correct: 0
            },
            {
                question: "Refleksi dalam pembelajaran bertujuan untuk?",
                options: [
                    "Mengevaluasi proses pembelajaran yang telah dilakukan",
                    "Menghitung nilai",
                    "Memberi hukuman",
                    "Menyusun RPP"
                ],
                correct: 0
            }
        ];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Plane selection
            document.querySelectorAll('.plane-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.plane-option').forEach(p => p.classList.remove('selected'));
                    this.classList.add('selected');
                    gameState.selectedPlane = parseInt(this.dataset.plane);
                    gameState.selectedPlaneColor = this.dataset.color;
                });
            });

            // Background selection
            document.querySelectorAll('.bg-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.bg-option').forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    gameState.background = this.dataset.bg;
                });
            });

            // Select first plane by default
            document.querySelector('.plane-option').classList.add('selected');
        });

        function startGame() {
            // Get player name
            gameState.playerName = document.getElementById('playerName').value || 'Pemain 1';
            gameState.questionCount = parseInt(document.getElementById('questionCount').value);
            
            // Shuffle and select questions
            gameState.questions = shuffleArray([...atpQuestions]).slice(0, gameState.questionCount);
            
            // Initialize opponents
            gameState.opponents = [];
            const planeNumbers = [1, 2, 3, 4, 5, 6, 7, 8].filter(n => n !== gameState.selectedPlane);
            const selectedOpponents = shuffleArray(planeNumbers).slice(0, 5);
            
            selectedOpponents.forEach((num, index) => {
                gameState.opponents.push({
                    plane: num,
                    position: 0,
                    color: document.querySelector(`.plane-${num}`).dataset.color,
                    speed: 0.6 + Math.random() * 0.3 // Random speed between 0.6 and 0.9
                });
            });

            // Show game screen
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
            
            // Set background
            const bg = document.getElementById('gameBackground');
            bg.className = 'game-background ' + gameState.background;
            
            // Add stars for space background
            if (gameState.background === 'space') {
                addStars();
            }
            
            // Create race track
            createRaceTrack();
            
            // Start game after delay
            setTimeout(() => {
                showNextQuestion();
            }, 1000);
        }

        function addStars() {
            const bg = document.getElementById('gameBackground');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                bg.appendChild(star);
            }
        }

        function createRaceTrack() {
            const track = document.getElementById('raceTrack');
            track.innerHTML = '';
            
            // Add player
            const playerLane = createRacerLane(
                gameState.selectedPlane,
                gameState.selectedPlaneColor,
                gameState.playerName + ' (Anda)',
                true
            );
            track.appendChild(playerLane);
            
            // Add opponents
            gameState.opponents.forEach((opp, index) => {
                const lane = createRacerLane(
                    opp.plane,
                    opp.color,
                    `Pesawat ${opp.plane}`,
                    false
                );
                track.appendChild(lane);
            });
        }

        function createRacerLane(planeNum, color, name, isPlayer) {
            const lane = document.createElement('div');
            lane.className = 'racer-lane' + (isPlayer ? ' player' : '');
            lane.id = 'lane-' + (isPlayer ? 'player' : 'opponent-' + planeNum);
            
            const planeSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='${encodeURIComponent(color)}'/%3E%3Ctext x='50' y='60' text-anchor='middle' fill='white' font-size='30' font-weight='bold'%3E${planeNum}%3C/text%3E%3C/svg%3E`;
            
            lane.innerHTML = `
                <div class="lane-number">${planeNum}</div>
                <img class="lane-plane" src="${planeSvg}" alt="Pesawat ${planeNum}">
                <div class="lane-progress">
                    <div class="lane-progress-bar" id="progress-${isPlayer ? 'player' : 'opponent-' + planeNum}" 
                         style="width: 0%; background: ${color}">
                    </div>
                    <div class="finish-line"></div>
                </div>
            `;
            
            return lane;
        }

        function showNextQuestion() {
            if (gameState.currentQuestion >= gameState.questions.length) {
                endGame();
                return;
            }
            
            const question = gameState.questions[gameState.currentQuestion];
            
            // Update question number
            document.getElementById('questionNumber').textContent = 
                `Soal ${gameState.currentQuestion + 1}/${gameState.questions.length}`;
            
            // Update question text
            document.getElementById('questionText').textContent = question.question;
            
            // Create answer buttons
            const optionsContainer = document.getElementById('answerOptions');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            // Show modal
            document.getElementById('quizModal').classList.add('active');
            
            // Start timer
            startTimer();
        }

        function startTimer() {
            gameState.timeLeft = 30;
            updateTimer();
            
            gameState.timer = setInterval(() => {
                gameState.timeLeft--;
                updateTimer();
                
                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timer);
                    checkAnswer(-1, null); // Time's up
                }
            }, 1000);
        }

        function updateTimer() {
            const timerEl = document.getElementById('timer');
            timerEl.textContent = `⏱️ ${gameState.timeLeft}s`;
            
            if (gameState.timeLeft <= 10) {
                timerEl.style.background = '#cc0000';
            } else {
                timerEl.style.background = '#ff6b6b';
            }
        }

        function checkAnswer(selectedIndex, btnElement) {
            clearInterval(gameState.timer);
            
            const question = gameState.questions[gameState.currentQuestion];
            const buttons = document.querySelectorAll('.answer-btn');
            
            // Disable all buttons
            buttons.forEach(btn => btn.disabled = true);
            
            // Show correct answer
            if (selectedIndex === question.correct) {
                if (btnElement) {
                    btnElement.classList.add('correct');
                }
                gameState.correctAnswers++;
                gameState.playerPosition += (100 / gameState.questions.length);
                updatePlayerPosition();
            } else {
                if (btnElement) {
                    btnElement.classList.add('wrong');
                }
                // Show correct answer
                buttons[question.correct].classList.add('correct');
            }
            
            // Move opponents
            moveOpponents();
            
            // Check if anyone finished
            checkFinishLine();
            
            // Next question after delay
            setTimeout(() => {
                gameState.currentQuestion++;
                document.getElementById('quizModal').classList.remove('active');
                showNextQuestion();
            }, 2000);
        }

        function updatePlayerPosition() {
            const progressBar = document.getElementById('progress-player');
            progressBar.style.width = Math.min(gameState.playerPosition, 100) + '%';
        }

        function moveOpponents() {
            gameState.opponents.forEach(opp => {
                // Opponents move based on their speed and some randomness
                const moveAmount = (100 / gameState.questions.length) * opp.speed * (0.8 + Math.random() * 0.4);
                opp.position += moveAmount;
                
                const progressBar = document.getElementById(`progress-opponent-${opp.plane}`);
                if (progressBar) {
                    progressBar.style.width = Math.min(opp.position, 100) + '%';
                }
            });
        }

        function checkFinishLine() {
            // Check if player finished
            if (gameState.playerPosition >= 100) {
                setTimeout(() => endGame(), 500);
                return;
            }
            
            // Check if any opponent finished
            const winner = gameState.opponents.find(opp => opp.position >= 100);
            if (winner) {
                setTimeout(() => endGame(), 500);
            }
        }

        function endGame() {
            document.getElementById('quizModal').classList.remove('active');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('resultsScreen').classList.add('active');
            
            // Determine winner
            let winner = gameState.playerName;
            let winnerPlane = gameState.selectedPlane;
            let isPlayerWin = gameState.playerPosition >= 100;
            
            if (!isPlayerWin) {
                const opponentWinner = gameState.opponents.reduce((prev, current) => 
                    (prev.position > current.position) ? prev : current
                );
                winner = `Pesawat ${opponentWinner.plane}`;
                winnerPlane = opponentWinner.plane;
            }
            
            // Update results
            const trophy = document.getElementById('trophy');
            const winnerText = document.getElementById('winnerText');
            
            if (isPlayerWin) {
                trophy.textContent = '🏆';
                winnerText.textContent = `🎉 Selamat! ${gameState.playerName} Menang! 🎉`;
                winnerText.style.color = '#FFD700';
            } else {
                trophy.textContent = '🥈';
                winnerText.textContent = `${winner} Menang!`;
                winnerText.style.color = '#667eea';
            }
            
            // Score details
            const scoreDetails = document.getElementById('scoreDetails');
            let html = `
                <div class="score-item">
                    <span>Jumlah Soal:</span>
                    <strong>${gameState.questions.length}</strong>
                </div>
                <div class="score-item">
                    <span>Jawaban Benar:</span>
                    <strong>${gameState.correctAnswers}/${gameState.questions.length}</strong>
                </div>
                <div class="score-item">
                    <span>Persentase:</span>
                    <strong>${Math.round((gameState.correctAnswers/gameState.questions.length)*100)}%</strong>
                </div>
                <div class="score-item">
                    <span>Posisi Akhir:</span>
                    <strong>${Math.round(gameState.playerPosition)}%</strong>
                </div>
            `;
            
            scoreDetails.innerHTML = html;
        }

        function backToMenu() {
            // Reset game state
            gameState.currentQuestion = 0;
            gameState.playerPosition = 0;
            gameState.correctAnswers = 0;
            gameState.opponents = [];
            
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('menuScreen').classList.add('active');
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Prevent zoom on double tap for mobile
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
