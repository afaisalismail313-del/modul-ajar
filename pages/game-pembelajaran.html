<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Balap Pesawat Kuis ATP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Menu Screen -->
    <div class="screen menu-screen active" id="menuScreen">
        <h1 class="game-title">✈️ GAME BALAP PESAWAT KUIS ATP ✈️</h1>
        
        <div class="menu-card">
            <div class="form-group">
                <label>Pilih Pesawat Anda:</label>
                <div class="plane-selection" id="planeSelection">
                    <!-- Generated by JS -->
                </div>
            </div>

            <div class="form-group">
                <label>Pilih Bidang Studi:</label>
                <select id="subjectSelect" onchange="updateTopics()">
                    <option value="">-- Pilih Bidang Studi --</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Bahasa Arab">Bahasa Arab Tingkat Lanjut</option>
                </select>
            </div>

            <div class="form-group">
                <label>Pilih Materi:</label>
                <select id="topicSelect" disabled>
                    <option value="">-- Pilih Materi --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jumlah Soal:</label>
                <select id="questionCount">
                    <option value="5">5 Soal</option>
                    <option value="10" selected>10 Soal</option>
                    <option value="15">15 Soal</option>
                </select>
            </div>

            <div class="form-group">
                <label>Pilih Background:</label>
                <div class="bg-selection" id="bgSelection">
                    <div class="bg-option selected" data-bg="space">🌌 Antariksa</div>
                    <div class="bg-option" data-bg="forest"> Hutan</div>
                    <div class="bg-option" data-bg="ocean"> Laut</div>
                    <div class="bg-option" data-bg="mountain">️ Gunung</div>
                </div>
            </div>

            <div class="form-group">
                <label>Nama Pemain:</label>
                <input type="text" id="playerName" placeholder="Masukkan nama Anda" value="Siswa Hebat">
            </div>

            <button class="btn btn-primary" id="startBtn">🎮 MULAI BALAPAN</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div class="screen game-screen" id="gameScreen">
        <!-- Screen 1: Racing Circuit -->
        <div class="screen-1 race-container" id="raceContainer">
            <div class="game-background" id="gameBackground"></div>
            <div class="race-track" id="raceTrack">
                <!-- Racers will be added here dynamically -->
            </div>
        </div>

        <!-- Screen 2: Quiz Container -->
        <div class="screen-2 quiz-container" id="quizContainer">
            <div class="question-header">
                <span class="question-number" id="questionNumber">Soal 1/10</span>
                <span class="timer" id="timer">⏱️ 30s</span>
            </div>
            <div class="question-text" id="questionText">
                Pertanyaan akan muncul di sini...
            </div>
            <div class="answer-options" id="answerOptions">
                <!-- Answer buttons will be added here -->
            </div>
        </div>
    </div>

    <!-- Results Screen -->
    <div class="screen results-screen" id="resultsScreen">
        <div class="results-card">
            <div class="trophy" id="trophy">🏆</div>
            <div class="winner-text" id="winnerText">Selamat!</div>
            <div class="score-details" id="scoreDetails">
                <!-- Score details will be added here -->
            </div>
            <button class="btn btn-primary" onclick="backToMenu()">🔄 Main Lagi</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
