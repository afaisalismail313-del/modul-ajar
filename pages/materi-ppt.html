<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PPT Materi - Al-Qur'an Hadits | MAN Bantaeng</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0f2417;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide{width:min(96vw,1100px);height:min(88vh,640px);background:linear-gradient(135deg,#e8f5e9,#fff8e1);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:34px 42px;overflow:auto;position:relative;border-top:8px solid #daa520}
.kick{color:#b8860b;font-weight:700;letter-spacing:2px;font-size:12px;text-transform:uppercase}
h1{color:#1a5c2e;font-size:30px;margin:10px 0}
h2{color:#1a5c2e;font-size:23px;margin-bottom:12px;border-left:6px solid #daa520;padding-left:12px}
h3{color:#1a5c2e;font-size:15px;margin:8px 0 6px}
.sub{color:#2e7d32;font-size:15px}
p,li{color:#223;font-size:14px;line-height:1.6}
ul{margin:6px 0 6px 20px}
ol{margin:6px 0 6px 20px}
.box{background:#fff;border:1px solid #cfd8cf;border-left:5px solid #2e7d32;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.box.gold{border-left-color:#daa520}
.box.blue{border-left-color:#1565c0}
.ayat{background:#f0faf0;border:1px solid #a5d6a7;border-radius:10px;padding:12px 16px;margin:8px 0;font-style:italic;color:#1b5e20;text-align:center;font-size:15px}
.tag{display:inline-block;background:#2e7d32;color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;margin:2px}
.tag.g{background:#daa520}.tag.b{background:#1565c0}
.center{text-align:center}
.big{font-size:17px;margin:14px 0}
.foot{position:absolute;bottom:10px;left:42px;right:42px;display:flex;justify-content:space-between;color:#777;font-size:11px}
.ctrl{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#12301d;padding:8px 14px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.ctrl button{background:#2e7d32;color:#fff;border:none;border-radius:20px;padding:7px 14px;cursor:pointer;font-size:14px}
.ctrl button:hover{background:#4caf50}
#ctr{color:#e8f5e9;font-size:13px;min-width:52px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
@media print{body{background:#fff;overflow:visible}.ctrl{display:none}.slide{box-shadow:none;height:auto;page-break-after:always}}
</style>
</head>
<body>
<div id="deck"><div class="slide"><div class="center big">⏳ Memuat…</div></div></div>
<div class="ctrl">
<button onclick="go(-1)">◀</button><span id="ctr"></span><button onclick="go(1)">▶</button>
<button onclick="fs()">⛶</button><button onclick="window.print()">🖨</button>
</div>
<script>
var DATA={
mapel:"Al-Qur'an Hadits",
kelas:"X",
semester:"Ganjil",
tahun:"2025/2026",
guru:"Sitti Sainab, S.Ag",
kepala:"Muhammad Arif Pither, S.Ag., M.M",
bab:"BAB 1: Membudayakan Pola Hidup Sederhana dan Menyantuni Dhuafa",
kataKunci:"Pola Hidup Sederhana",
tp:[
"Murid mampu menunjukkan sikap bersahaja dan seimbang dalam berkonsumsi sebagai wujud cinta Allah (QS al-Furqan: 67)",
"Murid dapat mengembangkan rasa syukur atas kecukupan yang dimiliki tanpa harus berlebih-lebihan",
"Murid mampu menganalisis bahaya kesombongan melalui refleksi kisah Qarun (QS al-Qashash: 79-82)",
"Murid mampu merumuskan hakikat kebajikan yang mencakup aspek sosial dan spiritual (QS al-Baqarah: 177)"
],
materi:[
{judul:"Materi 1 · Sikap Bersahaja (QS al-Furqan: 67)",poin:["Pola hidup sederhana: tidak berlebihan dan tidak pelit","Keseimbangan dalam berkonsumsi sebagai wujud cinta kepada Allah","Hadis Abdullah bin Amr tentang seni keseimbangan hidup","Dampak positif hidup sederhana bagi kesehatan mental dan sosial"]},
{judul:"Materi 2 · Refleksi Kisah Qarun (QS al-Qashash: 79-82)",poin:["Analisis bahaya kesombongan dan sifat tamak","Pelajaran dari kisah Qarun: harta tanpa syukur membawa kehancuran","Sikap rendah hati dalam menerima setiap karunia materi","Korelasi antara harta dan tanggung jawab sosial"]},
{judul:"Materi 3 · Hakikat Kebajikan (QS al-Baqarah: 177)",poin:["Kebajikan mencakup aspek sosial dan spiritual secara seimbang","Kepedulian terhadap yatim, miskin, dan kaum dhuafa","Empati sebagai implementasi cinta kepada sesama","Perencanaan pemberian bantuan secara kolaboratif"]},
{judul:"Materi 4 · Implementasi: Melawan Pendusta Agama (QS al-Ma'un)",poin:["Menjauhi perilaku pendusta agama dengan konsisten peduli pada yatim","Aksi nyata menyantuni dhuafa di lingkungan sekitar madrasah","Kerja kolaboratif dalam program santunan","Evaluasi dampak sosial dari aksi kepedulian"]}
]
};

var S=[],cur=0;
function build(){
S=[
/* 1 - JUDUL */
{h:'<div class="center" style="margin-top:36px"><div class="kick">Media Pembelajaran · MAN Bantaeng</div><h1>'+DATA.mapel+'</h1><div class="sub">'+DATA.bab+'</div><p style="margin-top:16px">Kelas '+DATA.kelas+' · Semester '+DATA.semester+' · TA '+DATA.tahun+'</p><p>Guru: <b>'+DATA.guru+'</b></p></div>'},

/* 2 - TUJUAN PEMBELAJARAN */
{h:'<h2>Tujuan Pembelajaran</h2><ul><li>'+DATA.tp.join('</li><li>')+'</li></ul>'},

/* 3 - MATERI 1 RINGKAS */
{h:'<h2>'+DATA.materi[0].judul+'</h2><ul><li>'+DATA.materi[0].poin.join('</li><li>')+'</li></ul>'},

/* 4 - MATERI 2 RINGKAS */
{h:'<h2>'+DATA.materi[1].judul+'</h2><ul><li>'+DATA.materi[1].poin.join('</li><li>')+'</li></ul>'},

/* 5 - MATERI 3 RINGKAS */
{h:'<h2>'+DATA.materi[2].judul+'</h2><ul><li>'+DATA.materi[2].poin.join('</li><li>')+'</li></ul>'},

/* 6 - MATERI 4 RINGKAS */
{h:'<h2>'+DATA.materi[3].judul+'</h2><ul><li>'+DATA.materi[3].poin.join('</li><li>')+'</li></ul>'},

/* 7 - PERTANYAAN PEMANTIK */
{h:'<h2>Pertanyaan Pemantik</h2><ul><li>Apa yang kamu ketahui tentang <b>'+DATA.kataKunci+'</b>?</li><li>Pernahkah kamu melihat/mengalami fenomena <b>'+DATA.kataKunci+'</b> dalam kehidupan sehari-hari?</li><li>Mengapa <b>'+DATA.kataKunci+'</b> penting bagi kehidupanmu dan lingkunganmu?</li><li>Bagaimana nilai Panca Cinta memaknai <b>'+DATA.kataKunci+'</b>?</li></ul>'},

/* 8 - PENJELASAN MATERI 1 */
{h:'<h2>📖 Penjelasan Materi 1: Sikap Bersahaja</h2>'
+'<div class="ayat">"Dan orang-orang yang apabila membelanjakan (harta), mereka tidak berlebihan, dan tidak (pula) kikir, dan adalah (pembelanjaan itu) di tengah-tengah antara yang demikian." (QS al-Furqan: 67)</div>'
+'<div class="box"><h3>🔍 Makna Ayat</h3><p>Ayat ini menggambarkan sifat <b>ibadurrahman</b> (hamba-hamba Allah Yang Maha Pengasih) yang bersikap <b>moderat</b> dalam membelanjakan harta. Kata <i>"lam yusrifu"</i> berarti tidak berlebih-lebihan, dan <i>"lam yaqturu"</i> berarti tidak kikir/pelit. Islam mengajarkan keseimbangan (<i>tawazun</i>) dalam segala aspek kehidupan.</p></div>'
+'<div class="box gold"><h3>💡 Implementasi dalam Kehidupan</h3><ul><li>Membeli sesuai kebutuhan, bukan keinginan semata</li><li>Tidak memaksakan gaya hidup di luar kemampuan</li><li>Tetap bersedekah meski dalam keterbatasan</li><li>Menghindari sifat <i>israf</i> (berlebih-lebihan) dan <i>tabdzir</i> (menghamburkan)</li></ul></div>'
+'<div class="box blue"><h3>📌 Hadis Pendukung</h3><p><i>"Makanlah, minumlah, bersedekahlah, dan berpakaianlah tanpa berlebihan dan tanpa kesombongan."</i> (HR Ahmad &amp; Nasa\'i)</p></div>'},

/* 9 - PENJELASAN MATERI 2 */
{h:'<h2>📖 Penjelasan Materi 2: Refleksi Kisah Qarun</h2>'
+'<div class="ayat">"Maka keluarlah Qarun kepada kaumnya dalam kemegahannya... Maka Kami benamkan dia bersama rumahnya ke dalam bumi." (QS al-Qashash: 79-81)</div>'
+'<div class="box"><h3>🔍 Analisis Kisah Qarun</h3><ul><li><b>Qarun</b> adalah sepupu Nabi Musa yang sangat kaya raya</li><li>Kekayaannya menjadikannya sombong dan merasa itu hasil jerih payahnya sendiri</li><li>Ia menolak nasihat untuk bersyukur dan berbagi</li><li>Akhirnya Allah menenggelamkannya beserta seluruh hartanya</li></ul></div>'
+'<div class="box gold"><h3>⚠️ Pelajaran Penting</h3><ul><li>Harta adalah <b>amanah</b>, bukan milik mutlak manusia</li><li>Kesombongan atas nikmat adalah bentuk <b>kufur nikmat</b></li><li>Kekayaan tanpa syukur = kehancuran</li><li>Setiap harta ada <b>hak orang lain</b> (zakat, sedekah, infak)</li></ul></div>'
+'<div class="box blue"><h3>🎯 Relevansi Masa Kini</h3><p>Fenomena <i>flexing</i> (pamer kekayaan) di media sosial adalah bentuk modern dari sifat Qarun. Sebagai muslim, kita diajarkan untuk <b>rendah hati</b> dan menggunakan harta di jalan Allah.</p></div>'},

/* 10 - PENJELASAN MATERI 3 */
{h:'<h2>📖 Penjelasan Materi 3: Hakikat Kebajikan</h2>'
+'<div class="ayat">"Kebajikan itu bukanlah kamu menghadapkan wajahmu ke timur dan ke barat, tetapi kebajikan itu ialah beriman kepada Allah, hari akhir, malaikat, kitab-kitab, dan nabi-nabi; memberikan harta yang dicintainya kepada kerabat, anak yatim, orang miskin, musafir, dan orang yang meminta-minta..." (QS al-Baqarah: 177)</div>'
+'<div class="grid2"><div class="box"><h3>🕌 Dimensi Spiritual (Hablum Minallah)</h3><ul><li>Iman kepada Allah dan hari akhir</li><li>Iman kepada malaikat, kitab, dan nabi</li><li>Mendirikan shalat</li><li>Menunaikan zakat</li></ul></div>'
+'<div class="box gold"><h3>🤝 Dimensi Sosial (Hablum Minannas)</h3><ul><li>Memberikan harta kepada kerabat</li><li>Menyantuni anak yatim dan orang miskin</li><li>Membantu musafir (ibnu sabil)</li><li>Menepati janji dan sabar</li></ul></div></div>'
+'<div class="box blue"><h3>💎 Kesimpulan</h3><p>Kebajikan sejati adalah <b>keseimbangan</b> antara hubungan vertikal dengan Allah dan hubungan horizontal dengan sesama manusia. Ibadah ritual tanpa kepedulian sosial adalah ibadah yang <b>tidak sempurna</b>.</p></div>'},

/* 11 - PENJELASAN MATERI 4 */
{h:'<h2>📖 Penjelasan Materi 4: Melawan Pendusta Agama</h2>'
+'<div class="ayat">"Tahukah kamu (orang) yang mendustakan agama? Itulah orang yang menghardik anak yatim, dan tidak menganjurkan memberi makan orang miskin." (QS al-Ma\'un: 1-3)</div>'
+'<div class="box"><h3>🔍 Ciri-Ciri Pendusta Agama</h3><ul><li><b>Menghardik anak yatim</b> — berlaku kasar dan tidak peduli</li><li><b>Tidak menganjurkan memberi makan orang miskin</b> — bersifat individualis</li><li><b>Lalai dalam shalatnya</b> — shalat tanpa kekhusyukan</li><li><b>Bermuka dua (riya\')</b> — beramal untuk dipuji manusia</li><li><b>Enggan menolong</b> — menahan barang yang berguna bagi orang lain</li></ul></div>'
+'<div class="box gold"><h3>✅ Aksi Nyata sebagai Muslim</h3><ul><li>Menyisihkan uang jajan untuk sedekah rutin</li><li>Mengunjungi dan membantu panti asuhan</li><li>Membuat program "Jumat Berkah" di madrasah</li><li>Menggalang dana untuk korban bencana</li><li>Menjadi relawan di kegiatan sosial masyarakat</li></ul></div>'
+'<div class="box blue"><h3>🤲 Doa & Refleksi</h3><p><i>"Ya Allah, jadikanlah kami hamba-Mu yang peduli, yang tidak menghardik anak yatim, yang selalu memberi makan orang miskin, dan yang ikhlas dalam beribadah. Aamiin."</i></p></div>'},

/* 12 - RANGKUMAN & PENUTUP */
{h:'<h2>Rangkuman Bab 1</h2>'
+'<div class="box"><h3>📋 Kesimpulan Utama</h3><ul>'
+'<li><b>Sikap Bersahaja:</b> Keseimbangan antara berlebih-lebihan dan kekikiran (QS al-Furqan: 67)</li>'
+'<li><b>Kisah Qarun:</b> Harta tanpa syukur membawa kehancuran (QS al-Qashash: 79-82)</li>'
+'<li><b>Hakikat Kebajikan:</b> Keseimbangan ibadah dan kepedulian sosial (QS al-Baqarah: 177)</li>'
+'<li><b>Melawan Pendusta Agama:</b> Aksi nyata peduli yatim dan dhuafa (QS al-Ma\'un)</li>'
+'</ul></div>'
+'<div class="box gold"><h3>🌟 Nilai Panca Cinta yang Terintegrasi</h3><p><span class="tag">Cinta Allah & Rasul</span> <span class="tag">Cinta Diri & Sesama</span> <span class="tag g">Cinta Ilmu</span> <span class="tag b">Cinta Lingkungan</span></p></div>'
+'<div class="center" style="margin-top:20px"><div class="kick">Terima Kasih</div><h1>Wassalamu\'alaikum Wr. Wb.</h1><p style="margin-top:10px;font-size:13px">Belajar dengan <span class="tag">Mindful</span> <span class="tag g">Meaningful</span> <span class="tag b">Joyful</span></p>'
+'<p style="margin-top:16px;font-size:12px;color:#555">Mengetahui, Kepala Madrasah: <b>'+DATA.kepala+'</b><br>Guru Mata Pelajaran: <b>'+DATA.guru+'</b></p></div></div>'}
];
}

function render(){
var deck=document.getElementById('deck');
var s=S[cur];
if(!s){deck.innerHTML='<div class="slide"><div class="center big">⚠️ Slide tidak tersedia</div></div>';return;}
deck.innerHTML='<div class="slide">'+s.h+'<div class="foot"><span>MAN Bantaeng · '+DATA.mapel+' · Kelas '+DATA.kelas+'</span><span>Slide '+(cur+1)+' / '+S.length+'</span></div></div>';
document.getElementById('ctr').textContent=(cur+1)+' / '+S.length;
}
function go(d){if(!S.length)return;cur=Math.max(0,Math.min(S.length-1,cur+d));render();}
function fs(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}}
document.addEventListener('keydown',function(e){
if(e.key==='ArrowRight'||e.key===' ')go(1);
if(e.key==='ArrowLeft')go(-1);
if(e.key==='Home'){cur=0;render();}
if(e.key==='End'){cur=S.length-1;render();}
});

try{build();cur=0;render();}catch(err){
document.getElementById('deck').innerHTML='<div class="slide"><div class="center big">⚠️ Terjadi kesalahan: '+err.message+'</div></div>';
}
</script>
</body>
</html>
