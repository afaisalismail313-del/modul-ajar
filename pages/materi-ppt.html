<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PPT Materi - Al-Qur'an Hadits | MAN Bantaeng</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0f2417;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide{width:min(96vw,1100px);height:min(88vh,640px);background:linear-gradient(135deg,#e8f5e9,#fff8e1);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:34px 42px;overflow:auto;position:relative;border-top:8px solid #daa520}
.kick{color:#b8860b;font-weight:700;letter-spacing:2px;font-size:12px;text-transform:uppercase}
h1{color:#1a5c2e;font-size:30px;margin:10px 0}
h2{color:#1a5c2e;font-size:23px;margin-bottom:12px;border-left:6px solid #daa520;padding-left:12px}
h3{color:#1a5c2e;font-size:15px;margin:8px 0 6px}
.sub{color:#2e7d32;font-size:15px}
p,li{color:#223;font-size:14px;line-height:1.5}
ul{margin:6px 0 6px 20px}
.box{background:#fff;border:1px solid #cfd8cf;border-left:5px solid #2e7d32;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.tag{display:inline-block;background:#2e7d32;color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;margin:2px}
.tag.g{background:#daa520}.tag.b{background:#1565c0}
.center{text-align:center}
.big{font-size:17px;margin:14px 0}
.foot{position:absolute;bottom:10px;left:42px;right:42px;display:flex;justify-content:space-between;color:#777;font-size:11px}
.ctrl{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#12301d;padding:8px 14px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.ctrl button{background:#2e7d32;color:#fff;border:none;border-radius:20px;padding:7px 14px;cursor:pointer;font-size:14px}
.ctrl button:hover{background:#4caf50}
#ctr{color:#e8f5e9;font-size:13px;min-width:52px;text-align:center}
@media print{body{background:#fff;overflow:visible}.ctrl{display:none}.slide{box-shadow:none;height:auto;page-break-after:always}}
</style>
</head>
<body>
<div id="deck"><div class="slide"><div class="center big">⏳ Memuat…</div></div></div>
<div class="ctrl">
<button onclick="go(-1)">◀</button><span id="ctr"></span><button onclick="go(1)">▶</button>
<button onclick="fs()">⛶</button><button onclick="window.print()">🖨</button>
</div>
<script>
/* ===== DATA TERTANAM (MANDIRI, TANPA MODUL AJAR) ===== */
var DATA={
mapel:"Al-Qur'an Hadits",
kelas:"X",
semester:"Ganjil",
tahun:"2025/2026",
guru:"Sitti Sainab, S.Ag",
kepala:"Muhammad Arif Pither, S.Ag., M.M",
bab:"BAB 1: Membudayakan Pola Hidup Sederhana dan Menyantuni Dhuafa",
kataKunci:"Pola Hidup Sederhana",
tp:[
"Murid mampu menunjukkan sikap bersahaja dan seimbang dalam berkonsumsi sebagai wujud cinta Allah (QS al-Furqan: 67)",
"Murid dapat mengembangkan rasa syukur atas kecukupan yang dimiliki tanpa harus berlebih-lebihan",
"Murid mampu menganalisis bahaya kesombongan melalui refleksi kisah Qarun (QS al-Qashash: 79-82)",
"Murid mampu merumuskan hakikat kebajikan yang mencakup aspek sosial dan spiritual (QS al-Baqarah: 177)"
],
materi:[
{judul:"Materi 1 · Sikap Bersahaja (QS al-Furqan: 67)",poin:["Pola hidup sederhana: tidak berlebihan dan tidak pelit","Keseimbangan dalam berkonsumsi sebagai wujud cinta kepada Allah","Hadis Abdullah bin Amr tentang seni keseimbangan hidup","Dampak positif hidup sederhana bagi kesehatan mental dan sosial"]},
{judul:"Materi 2 · Refleksi Kisah Qarun (QS al-Qashash: 79-82)",poin:["Analisis bahaya kesombongan dan sifat tamak","Pelajaran dari kisah Qarun: harta tanpa syukur membawa kehancuran","Sikap rendah hati dalam menerima setiap karunia materi","Korelasi antara harta dan tanggung jawab sosial"]},
{judul:"Materi 3 · Hakikat Kebajikan (QS al-Baqarah: 177)",poin:["Kebajikan mencakup aspek sosial dan spiritual secara seimbang","Kepedulian terhadap yatim, miskin, dan kaum dhuafa","Empati sebagai implementasi cinta kepada sesama","Perencanaan pemberian bantuan secara kolaboratif"]},
{judul:"Materi 4 · Implementasi: Melawan Pendusta Agama (QS al-Ma'un)",poin:["Menjauhi perilaku pendusta agama dengan konsisten peduli pada yatim","Aksi nyata menyantuni dhuafa di lingkungan sekitar madrasah","Kerja kolaboratif dalam program santunan","Evaluasi dampak sosial dari aksi kepedulian"]}
],
pancaCinta:"Cinta kepada Allah dan Rasul · Cinta Diri dan Sesama",
integrasiKBC:"Pola hidup sederhana sebagai wujud cinta kepada Allah; menyantuni dhuafa sebagai implementasi cinta kepada diri dan sesama manusia; refleksi kisah Qarun sebagai pelajaran untuk tidak sombong; aksi nyata sebagai bentuk cinta ilmu dan cinta lingkungan.",
awal:"Salam, doa pembuka, tadarus ayat terkait. Guru melakukan apersepsi dengan menghubungkan pengalaman siswa tentang hidup sederhana. Menyampaikan tujuan pembelajaran dan pertanyaan pemantik.",
inti:"Pembelajaran mendalam (Deep Learning): Mindful — siswa memahami makna ayat dengan penuh kesadaran; Meaningful — mengaitkan materi dengan kehidupan nyata dan nilai Panca Cinta; Joyful — berdiskusi kelompok, presentasi, dan melakukan aksi nyata menyantuni dhuafa secara kolaboratif.",
akhir:"Refleksi bersama tentang nilai-nilai yang dipelajari. Guru memberikan penguatan dan apresiasi. Doa penutup dan salam. Penugasan proyek aksi nyata untuk pertemuan berikutnya.",
asesmenAwal:"Tanya jawab untuk menggali pengetahuan awal siswa tentang konsep hidup sederhana dan sedekah, serta pengalaman mereka dalam berbagi dengan sesama.",
asesmenProses:"Observasi keaktifan diskusi kelompok, penilaian presentasi, refleksi tertulis tentang perubahan sikap, dan partisipasi dalam proyek aksi nyata.",
asesmenAkhir:"Tes sumatif pilihan ganda dan esai tentang pemahaman ayat-ayat terkait; penilaian proyek aksi nyata menyantuni dhuafa; portofolio refleksi sikap selama satu bab.",
kunciJawaban:"Kunci jawaban terlampir dalam dokumen asesmen guru."
};

/* ===== PEMBANGUNAN SLIDE ===== */
var S=[],cur=0;
function build(){
S=[
/* 1 */ {h:'<div class="center" style="margin-top:36px"><div class="kick">Media Pembelajaran · MAN Bantaeng</div><h1>'+DATA.mapel+'</h1><div class="sub">'+DATA.bab+'</div><p style="margin-top:16px">Kelas '+DATA.kelas+' · Semester '+DATA.semester+' · TA '+DATA.tahun+'</p><p>Guru: <b>'+DATA.guru+'</b></p></div>'},
/* 2 */ {h:'<h2>Tujuan Pembelajaran</h2><ul><li>'+DATA.tp.join('</li><li>')+'</li></ul>'},
/* 3 */ {h:'<h2>'+DATA.materi[0].judul+'</h2><ul><li>'+DATA.materi[0].poin.join('</li><li>')+'</li></ul>'},
/* 4 */ {h:'<h2>'+DATA.materi[1].judul+'</h2><ul><li>'+DATA.materi[1].poin.join('</li><li>')+'</li></ul>'},
/* 5 */ {h:'<h2>'+DATA.materi[2].judul+'</h2><ul><li>'+DATA.materi[2].poin.join('</li><li>')+'</li></ul>'},
/* 6 */ {h:'<h2>'+DATA.materi[3].judul+'</h2><ul><li>'+DATA.materi[3].poin.join('</li><li>')+'</li></ul>'},
/* 7 */ {h:'<h2>Pertanyaan Pemantik</h2><ul><li>Apa yang kamu ketahui tentang <b>'+DATA.kataKunci+'</b>?</li><li>Pernahkah kamu melihat/mengalami fenomena <b>'+DATA.kataKunci+'</b> dalam kehidupan sehari-hari?</li><li>Mengapa <b>'+DATA.kataKunci+'</b> penting bagi kehidupanmu dan lingkunganmu?</li><li>Bagaimana nilai Panca Cinta memaknai <b>'+DATA.kataKunci+'</b>?</li></ul>'},
/* 8 */ {h:'<h2>Kegiatan Pembelajaran</h2><div class="box"><h3>🟢 Awal (10 Menit)</h3><p>'+DATA.awal+'</p></div><div class="box"><h3>🟡 Inti · Deep Learning</h3><p><span class="tag">Mindful</span><span class="tag g">Meaningful</span><span class="tag b">Joyful</span></p><p>'+DATA.inti+'</p></div><div class="box"><h3>🔵 Penutup (15 Menit)</h3><p>'+DATA.akhir+'</p></div>'},
/* 9 */ {h:'<h2>Nilai Panca Cinta (KBC)</h2><div class="box"><h3>Topik Panca Cinta</h3><p>'+DATA.pancaCinta+'</p></div><div class="box"><h3>Integrasi KBC dalam Pembelajaran</h3><p>'+DATA.integrasiKBC+'</p></div>'},
/* 10*/ {h:'<h2>Asesmen</h2><div class="box"><h3>📋 Asesmen Awal</h3><p>'+DATA.asesmenAwal+'</p></div><div class="box"><h3>📝 Asesmen Proses</h3><p>'+DATA.asesmenProses+'</p></div><div class="box"><h3>✅ Asesmen Akhir</h3><p>'+DATA.asesmenAkhir+'</p></div>'},
/* 11*/ {h:'<h2>Rangkuman</h2><ul><li>'+DATA.materi.map(function(m){return '<b>'+m.judul.split('·')[0].trim()+':</b> '+m.poin[0];}).join('</li><li>')+'</li></ul>'},
/* 12*/ {h:'<div class="center" style="margin-top:46px"><div class="kick">Terima Kasih</div><h1>Wassalamu\'alaikum Wr. Wb.</h1><p style="margin-top:14px">Belajar dengan <span class="tag">Mindful</span><span class="tag g">Meaningful</span><span class="tag b">Joyful</span></p><div style="margin-top:22px;font-size:12px;color:#555"><p>Mengetahui, Kepala Madrasah</p><p><b>'+DATA.kepala+'</b></p><p style="margin-top:14px">Guru Mata Pelajaran</p><p><b>'+DATA.guru+'</b></p></div></div>'}
];
}

/* ===== RENDER & NAVIGASI ===== */
function render(){
var deck=document.getElementById('deck');
var s=S[cur];
if(!s){deck.innerHTML='<div class="slide"><div class="center big">⚠️ Slide tidak tersedia</div></div>';return;}
deck.innerHTML='<div class="slide">'+s.h+'<div class="foot"><span>MAN Bantaeng · '+DATA.mapel+' · Kelas '+DATA.kelas+'</span><span>Slide '+(cur+1)+' / '+S.length+'</span></div></div>';
document.getElementById('ctr').textContent=(cur+1)+' / '+S.length;
}
function go(d){if(!S.length)return;cur=Math.max(0,Math.min(S.length-1,cur+d));render();}
function fs(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}}
document.addEventListener('keydown',function(e){
if(e.key==='ArrowRight'||e.key===' ')go(1);
if(e.key==='ArrowLeft')go(-1);
if(e.key==='Home'){cur=0;render();}
if(e.key==='End'){cur=S.length-1;render();}
});

/* ===== INISIALISASI ===== */
try{build();cur=0;render();}catch(err){
document.getElementById('deck').innerHTML='<div class="slide"><div class="center big">⚠️ Terjadi kesalahan: '+err.message+'</div></div>';
}
</script>
</body>
</html>
