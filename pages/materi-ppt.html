<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PPT Materi | MAN Bantaeng</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0f2417;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide{width:min(96vw,1100px);height:min(88vh,640px);background:linear-gradient(135deg,#e8f5e9,#fff8e1);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:34px 42px;overflow:auto;position:relative;border-top:8px solid #daa520}
.kick{color:#b8860b;font-weight:700;letter-spacing:2px;font-size:12px;text-transform:uppercase}
h1{color:#1a5c2e;font-size:30px;margin:10px 0}
h2{color:#1a5c2e;font-size:23px;margin-bottom:12px;border-left:6px solid #daa520;padding-left:12px}
h3{color:#1a5c2e;font-size:15px;margin:8px 0 6px}
.sub{color:#2e7d32;font-size:15px}
p,li{color:#223;font-size:14px;line-height:1.6}
ul,ol{margin:6px 0 6px 20px}
.box{background:#fff;border:1px solid #cfd8cf;border-left:5px solid #2e7d32;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.box.gold{border-left-color:#daa520}
.box.blue{border-left-color:#1565c0}
.ayat{background:#f0faf0;border:1px solid #a5d6a7;border-radius:10px;padding:12px 16px;margin:8px 0;font-style:italic;color:#1b5e20;text-align:center;font-size:15px}
.tag{display:inline-block;background:#2e7d32;color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;margin:2px}
.tag.g{background:#daa520}.tag.b{background:#1565c0}
.center{text-align:center}
.big{font-size:17px;margin:14px 0}
.foot{position:absolute;bottom:10px;left:42px;right:42px;display:flex;justify-content:space-between;color:#777;font-size:11px}
.ctrl{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#12301d;padding:8px 14px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.ctrl button{background:#2e7d32;color:#fff;border:none;border-radius:20px;padding:7px 14px;cursor:pointer;font-size:14px}
.ctrl button:hover{background:#4caf50}
#ctr{color:#e8f5e9;font-size:13px;min-width:52px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
@media print{body{background:#fff;overflow:visible}.ctrl{display:none}.slide{box-shadow:none;height:auto;page-break-after:always}}
</style>
</head>
<body>
<div id="deck"><div class="slide"><div class="center big">⏳ Memuat…</div></div></div>
<div class="ctrl">
<button onclick="go(-1)">◀</button><span id="ctr"></span><button onclick="go(1)">▶</button>
<button onclick="fs()">⛶</button><button onclick="window.print()">🖨</button>
<button onclick="location.href='index.html'">📋 Modul</button>
</div>
<script>
var DATA=null, S=[], cur=0;

// ===== BACA DATA DARI MODUL AJAR =====
try{
  DATA = JSON.parse(localStorage.getItem('maPPTData') || 'null');
}catch(e){ DATA=null; }

// ===== SLIDE PANDUAN JIKA BELUM GENERATE =====
function buildEmpty(){
  S=[{h:'<div class="center" style="margin-top:50px">'
    +'<div class="kick">PPT Materi · MAN Bantaeng</div>'
    +'<h1>📽 Belum Ada Data Materi</h1>'
    +'<p class="big">Halaman ini terhubung dengan <b>Modul Ajar</b> via penyimpanan lokal.</p>'
    +'<p style="text-align:left;max-width:600px;margin:20px auto">1️⃣ Buka <b>Modul Ajar</b> lalu login<br>2️⃣ Pilih Mata Pelajaran, Kelas, Semester & Topik<br>3️⃣ Klik <b>⚡ Generate Modul Ajar</b><br>4️⃣ Klik <b>📽 Buka PPT Materi</b></p>'
    +'<p class="big">✨ Slide otomatis mengikuti bidang studi & materi yang di-generate!</p>'
    +'<p style="margin-top:24px"><span class="tag">Mindful</span> <span class="tag g">Meaningful</span> <span class="tag b">Joyful</span></p>'
    +'</div>'}];
}

// ===== BANGUN SLIDE DINAMIS =====
function build(){
  S=[];
  var d=DATA;

  // --- Slide 1: JUDUL ---
  S.push({h:'<div class="center" style="margin-top:36px"><div class="kick">Media Pembelajaran · MAN Bantaeng</div>'
    +'<h1>'+esc(d.mapel)+'</h1><div class="sub">'+esc(d.bab)+'</div>'
    +'<p style="margin-top:16px">Kelas '+esc(d.kelas)+' · Semester '+esc(d.semester)+' · TA '+esc(d.tahun)+'</p>'
    +'<p>Guru: <b>'+esc(d.guru)+'</b></p></div>'});

  // --- Slide 2: TUJUAN PEMBELAJARAN ---
  S.push({h:'<h2>Tujuan Pembelajaran</h2><ul><li>'+d.tp.map(esc).join('</li><li>')+'</li></ul>'});

  // --- Slide 3..N: MATERI RINGKAS (max 4) ---
  d.materi.slice(0,4).forEach(function(m){
    S.push({h:'<h2>'+esc(m.judul)+'</h2><ul><li>'+m.poin.map(esc).join('</li><li>')+'</li></ul>'});
  });

  // --- Slide: PERTANYAAN PEMANTIK ---
  var kk=esc(d.kataKunci||d.bab);
  S.push({h:'<h2>Pertanyaan Pemantik</h2><ul>'
    +'<li>Apa yang kamu ketahui tentang <b>'+kk+'</b>?</li>'
    +'<li>Pernahkah kamu melihat/mengalami fenomena <b>'+kk+'</b> dalam kehidupan sehari-hari?</li>'
    +'<li>Mengapa <b>'+kk+'</b> penting bagi kehidupanmu dan lingkunganmu?</li>'
    +'<li>Bagaimana nilai Panca Cinta memaknai <b>'+kk+'</b>?</li></ul>'});

  // --- Slide PENJELASAN MATERI (dinamis) ---
  d.materi.slice(0,4).forEach(function(m,i){
    var h='<h2>📖 Penjelasan Materi '+(i+1)+': '+esc(m.judul)+'</h2>';
    if(m.detail){
      if(m.detail.ayat) h+='<div class="ayat">'+m.detail.ayat+'</div>';
      if(m.detail.makna) h+='<div class="box"><h3>🔍 Makna & Konsep</h3><p>'+m.detail.makna+'</p></div>';
      if(m.detail.implementasi) h+='<div class="box gold"><h3>💡 Implementasi</h3><ul><li>'+m.detail.implementasi.join('</li><li>')+'</li></ul></div>';
      if(m.detail.catatan) h+='<div class="box blue"><h3>📌 Catatan Penting</h3><p>'+m.detail.catatan+'</p></div>';
    } else {
      h+='<div class="box"><h3>🔍 Konsep Inti</h3><p><b>'+esc(m.poin[0])+'</b></p></div>';
      h+='<div class="box gold"><h3>💡 Pengembangan</h3><ul><li>'+m.poin.slice(1).map(esc).join('</li><li>')+'</li></ul></div>';
      h+='<div class="box blue"><h3>🎯 Relevansi</h3><p>Kaitkan <b>'+kk+'</b> dengan kehidupan sehari-hari dan nilai-nilai Panca Cinta dalam konteks ke-madrasah-an.</p></div>';
    }
    S.push({h:h});
  });

  // --- Slide AKHIR: RANGKUMAN ---
  var rangkum='<h2>Rangkuman</h2><div class="box"><h3>📋 Kesimpulan Utama</h3><ul>';
  d.materi.slice(0,4).forEach(function(m){
    rangkum+='<li><b>'+esc(m.judul)+':</b> '+esc(m.poin[0])+'</li>';
  });
  rangkum+='</ul></div>';
  rangkum+='<div class="box gold"><h3>🌟 Nilai Panca Cinta</h3><p>';
  (d.pancaCinta||[]).forEach(function(c){rangkum+='<span class="tag">'+esc(c)+'</span> ';});
  rangkum+='</p></div>';
  rangkum+='<div class="center" style="margin-top:20px"><div class="kick">Terima Kasih</div>'
    +'<h1>Wassalamu\'alaikum Wr. Wb.</h1>'
    +'<p style="margin-top:10px;font-size:13px">Belajar dengan <span class="tag">Mindful</span> <span class="tag g">Meaningful</span> <span class="tag b">Joyful</span></p>'
    +'<p style="margin-top:16px;font-size:12px;color:#555">Kepala Madrasah: <b>'+esc(d.kepala)+'</b><br>Guru Mata Pelajaran: <b>'+esc(d.guru)+'</b></p></div>';
  S.push({h:rangkum});
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  var deck=document.getElementById('deck');
  var s=S[cur];
  if(!s){deck.innerHTML='<div class="slide"><div class="center big">⚠️ Slide tidak tersedia</div></div>';return;}
  var foot = DATA ? ('MAN Bantaeng · '+esc(DATA.mapel)+' · Kelas '+esc(DATA.kelas)) : 'MAN Bantaeng';
  deck.innerHTML='<div class="slide">'+s.h+'<div class="foot"><span>'+foot+'</span><span>Slide '+(cur+1)+' / '+S.length+'</span></div></div>';
  document.getElementById('ctr').textContent=(cur+1)+' / '+S.length;
}
function go(d){if(!S.length)return;cur=Math.max(0,Math.min(S.length-1,cur+d));render();}
function fs(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' ')go(1);
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='Home'){cur=0;render();}
  if(e.key==='End'){cur=S.length-1;render();}
});

try{
  if(!DATA){buildEmpty();}else{build();}
  cur=0;render();
}catch(err){
  document.getElementById('deck').innerHTML='<div class="slide"><div class="center big">⚠️ Terjadi kesalahan: '+err.message+'</div></div>';
}
</script>
</body>
</html>
